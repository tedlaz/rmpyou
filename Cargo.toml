[package]
name = "rmpyou"
version = "0.1.0"
authors = ["Ted Lazaros"]
edition = "2024"
description = "Turn an MP3 and a cover image into a YouTube-ready video"
license = "MIT"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
rfd = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true
strip = true

[build-dependencies]
slint-build = "1.18"
