name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # GITHUB_REPOSITORY is baked in at compile time and enables the auto-updater.
      - run: cargo build --release

      # FFmpeg is not bundled: the app downloads it once on first run, so updates stay small.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/rmpyou.exe, README.md, LICENSE dist/
          Compress-Archive dist/* rmpyou-x86_64-pc-windows-msvc.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: rmpyou-x86_64-pc-windows-msvc.zip
          generate_release_notes: true
